[workspace]
members = ["frust-core", "frust-cli"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
authors = ["Zak Noble-Clarke"]
repository = "https://github.com/Seggys116/frust"
rust-version = "1.100"

# The library keeps its crate name frust_core. Its package is frust-rs-core because frust-core is taken on crates.io.
[workspace.dependencies]
frust-core = { package = "frust-rs-core", path = "frust-core", version = "=0.5.0" }
