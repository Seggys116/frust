[package]
name = "frust-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "fcargo entry point, toolchain installer, and release-gate reporter."

[[bin]]
name = "fcargo"
path = "src/bin/fcargo.rs"

[[bin]]
name = "frust-install"
path = "src/bin/frust-install.rs"

[[bin]]
name = "frust-gates"
path = "src/bin/frust-gates.rs"

[lib]
name = "frust_cli"
path = "src/lib.rs"

[dependencies]
frust-core = { path = "../frust-core" }
