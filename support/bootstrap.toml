# Shared stage-2 recipe for the unpatched control and fRust.
# The build script appends an absolute `build-dir`. Do not set profile flags here
# that are not used for both builds.
# The optimization settings of upstream's dist builds are not here. They are applied on top of
# this file as overrides from bootstrap-common.toml and the bootstrap-linux.toml or
# bootstrap-macos.toml of the host. Do not repeat their keys in this file.
change-id = 162423

[llvm]
download-ci-llvm = true
assertions = false

[build]
build-stage = 2
test-stage = 2
doc-stage = 2
extended = true
tools = ["cargo"]
docs = false
locked-deps = true
full-bootstrap = true
jobs = 12

[rust]
channel = "stable"
lto = "thin"
deny-warnings = false
debug = false
debug-assertions = false
debuginfo-level = 0
incremental = false
download-rustc = false
remap-debuginfo = true

[dist]
compression-profile = "fast"
