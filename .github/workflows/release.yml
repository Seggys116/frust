name: Release

# Pushing a v* tag builds the toolchain, publishes a GitHub release that `frust-install` downloads,
# then publishes the crates. Run by hand from a branch for a dry run that builds and smoke-tests
# everything and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: verify the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib

          with open("crates/Cargo.toml", "rb") as handle:
              workspace = tomllib.load(handle)
          version = workspace["workspace"]["package"]["version"]
          pinned = workspace["workspace"]["dependencies"]["frust-core"]["version"]
          if pinned != f"={version}":
              raise SystemExit(f"workspace dependency frust-core is {pinned}, expected ={version}")
          print(f"version={version}")
          PY
      - name: Require a matching tag and a green CI run on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ $GITHUB_REF_NAME != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the crate version v$VERSION"
            exit 1
          fi
          run=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=100 \
            --jq '[.workflow_runs[]] | sort_by([.created_at, .id]) | last')
          if [[ -z $run || $run == null ]]; then
            echo "::error::No CI run on main for $GITHUB_SHA. Merge the release commit to main and let CI pass first."
            exit 1
          fi
          status=$(jq -r '.status + "/" + (.conclusion // "none")' <<< "$run")
          if [[ $status != completed/success ]]; then
            echo "::error::CI for $GITHUB_SHA is $status: $(jq -r .html_url <<< "$run")"
            exit 1
          fi
          echo "CI passed: $(jq -r .html_url <<< "$run")"

  # The released toolchain has the experimental switches off, so parity is checked in that state.
  # macOS arm64 and Intel are built natively on their own runners.
  toolchains:
    needs: preflight
    uses: ./.github/workflows/toolchains.yml
    with:
      builds: '[{"variant":"frust","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"},{"variant":"frust","target":"aarch64-apple-darwin","os":"macos-latest"},{"variant":"frust","target":"x86_64-apple-darwin","os":"macos-15-intel"}]'
      codegen-cache: false
      relr: false

  crates-check:
    name: crates package and build
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo publish --workspace --dry-run --locked
        working-directory: crates

  package:
    name: package and smoke-test (${{ matrix.target }})
    needs: [preflight, toolchains]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@v8
        with:
          name: toolchain-frust-${{ matrix.target }}
          path: ${{ runner.temp }}/toolchain
      - name: Build frust-install
        working-directory: crates
        run: cargo build --release --locked -p frust-rs --bin frust-install
      - name: Package the release files
        run: |
          .github/scripts/package-release.sh "$RUNNER_TEMP/toolchain/frust-${{ matrix.target }}.tar.zst" \
            "${{ needs.preflight.outputs.version }}" "${{ matrix.target }}" crates/target/release/frust-install dist
          ls -l dist
      # frust-install is the way users get the toolchain, so the smoke test uses it end to end.
      - name: Install from the release files and build with the result
        run: |
          export FRUST_RELEASE_BASE="file://$PWD/dist"
          prefix=$RUNNER_TEMP/smoke
          crates/target/release/frust-install install --prefix "$prefix"
          "$prefix/current/bin/frustc" -vV
          "$prefix/current/bin/frust-install" update --prefix "$prefix"
          mkdir -p "$RUNNER_TEMP/launch"
          support/launch-check.sh "$prefix/current" "$RUNNER_TEMP/launch" "$RUNNER_TEMP/launch/launch.log"
          cat "$RUNNER_TEMP/launch/launch.log"
      - uses: actions/upload-artifact@v7
        with:
          name: release-files-${{ matrix.target }}
          path: dist
          retention-days: 14

  github-release:
    name: publish the GitHub release
    needs: [preflight, package, crates-check]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-files-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          flags=(--latest)
          [[ $VERSION == *-* ]] && flags=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"

  # After the release exists, so a published crate never points frust-install at missing assets.
  crates-io:
    name: publish the crates
    needs: github-release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Publish
        working-directory: crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z $CARGO_REGISTRY_TOKEN ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add it as a repository secret, then re-run this job."
            exit 1
          fi
          cargo publish --workspace --locked
