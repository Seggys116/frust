name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          exe=""
          if [ "${{ matrix.ext }}" = "zip" ]; then exe=".exe"; fi
          name="frust-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in frust fcargo fclippy frustc frustdoc frustup frustfmt frust-wrap; do
            cp "target/${{ matrix.target }}/release/$b$exe" "dist/$name/"
          done
          cp LICENSE README.md "dist/$name/"
          cd "dist/$name"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "../$name.zip" ./* >/dev/null
          else
            tar -czf "../$name.tar.gz" ./*
          fi
          cd ..
          archive="$name.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frust-${{ matrix.target }}
          path: |
            dist/frust-${{ matrix.target }}.${{ matrix.ext }}
            dist/frust-${{ matrix.target }}.${{ matrix.ext }}.sha256

  crates-io:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
