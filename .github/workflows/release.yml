name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: verify release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require matching version and successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CI_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml
        run: |
          set -euo pipefail
          release_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          if [ "$RELEASE_TAG" != "v$release_version" ]; then
            echo "::error::Release tag $RELEASE_TAG must match package version v$release_version. CI: $CI_WORKFLOW_URL"
            exit 1
          fi
          RELEASE_COMMIT_SHA="$(git rev-parse HEAD)"
          if ! ci_runs="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$RELEASE_COMMIT_SHA" -f per_page=100)"; then
            echo "::error::Cannot verify CI for $RELEASE_COMMIT_SHA. CI: $CI_WORKFLOW_URL"
            exit 1
          fi
          if ! ci_run="$(jq -c --arg sha "$RELEASE_COMMIT_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by([.created_at, .id]) | last' <<< "$ci_runs")"; then
            echo "::error::Cannot read CI evidence for $RELEASE_COMMIT_SHA. CI: $CI_WORKFLOW_URL"
            exit 1
          fi
          if [ -z "$ci_run" ] || [ "$ci_run" = "null" ]; then
            echo "::error::No main/push CI run found for $RELEASE_COMMIT_SHA. CI: $CI_WORKFLOW_URL"
            exit 1
          fi
          ci_status="$(jq -r '.status // "unknown"' <<< "$ci_run")"
          ci_conclusion="$(jq -r '.conclusion // "none"' <<< "$ci_run")"
          ci_url="$(jq -r --arg fallback "$CI_WORKFLOW_URL" '.html_url // $fallback' <<< "$ci_run")"
          if [ "$ci_status" != completed ] || [ "$ci_conclusion" != success ]; then
            echo "::error::Latest main/push CI for $RELEASE_COMMIT_SHA is $ci_status/$ci_conclusion: $ci_url"
            exit 1
          fi
          echo "Verified $RELEASE_TAG at $RELEASE_COMMIT_SHA against successful CI: $ci_url"

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          exe=""
          if [ "${{ matrix.ext }}" = "zip" ]; then exe=".exe"; fi
          name="frust-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for b in frust fcargo fclippy frustc frustdoc frustup frustfmt frust-wrap; do
            cp "target/${{ matrix.target }}/release/$b$exe" "dist/$name/"
          done
          cp LICENSE README.md "dist/$name/"
          cd "dist/$name"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "../$name.zip" ./* >/dev/null
          else
            tar -czf "../$name.tar.gz" ./*
          fi
          cd ..
          archive="$name.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: frust-${{ matrix.target }}
          path: |
            dist/frust-${{ matrix.target }}.${{ matrix.ext }}
            dist/frust-${{ matrix.target }}.${{ matrix.ext }}.sha256

  crates-io:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" assets/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
