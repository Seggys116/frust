name: Toolchains

# Manual, and called by Benchmark and Release. Builds the stage-2 toolchains from the pinned sources.
# The shipped fRust toolchain for Linux x86-64 comes in two CPU variants, baseline (plain x86-64) and
# v3 (compiler and tools built for x86-64-v3). Both are built by support/optimize-linux-v2.sh from the
# stored PGO and BOLT profiles, with the clang, LLVM tools and profile bundles that
# support/fetch-build-assets.sh downloads as listed in support/build-assets.lock (docs/build-assets.md).
# The unpatched control, and the fRust toolchain on macOS, use the plain recipe with the optimization
# settings of upstream's official dist builds for their platform (support/bootstrap-*.toml), except
# PGO and BOLT. PGO profiles can be supplied to that plain recipe through FRUST_PGO_PROFILES (see
# build-toolchain.sh), this workflow does not set it.
# Every fRust toolchain includes clippy and rustfmt (built by bootstrap against its own compiler). Each is
# then launched with no ambient state, which runs a build, rustdoc, clippy and rustfmt, and on Linux it also
# passes the fat-LTO, codegen-unit and warm-fresh parity proof, both variants. The archive that users get is
# made from the artifact by the package job of the Release workflow, which adds the official components and
# runs the validation suite on the installed result.
#
# A builds entry is {variant, target, os} with an optional cpu, baseline or v3. cpu is only for the
# fRust toolchain on x86_64-unknown-linux-gnu, and an entry without it is the baseline. The
# archive and artifact of a v3 build are named frust-v3-<target>, the others <variant>-<target>.
# An entry may also set pgo to rustc, for the fRust toolchain on the macOS targets only. That is a
# candidate, never part of a release: .github/scripts/build-toolchain-pgo.sh builds the plain
# recipe with a rustc profile trained natively in the same build and checks the evidence (see
# docs/benchmarks.md). Its archive and artifact are named frust-pgo-<target>, its cache key adds the
# hash of its own script, tools and training patch, and a cache hit says in the run summary that no
# new PGO evidence was produced.
on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Ignore cached toolchains and build them again
        type: boolean
        default: false
      codegen-cache:
        description: FRUST_EXPERIMENTAL_CODEGEN_CACHE for the parity check
        type: boolean
        default: true
      relr:
        description: FRUST_EXPERIMENTAL_RELR for the parity check
        type: boolean
        default: true
      builds:
        description: JSON list of {variant, target, os, cpu (optional, baseline or v3), pgo (optional, rustc, macOS fRust only)} to build
        default: '[{"variant":"control","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"},{"variant":"frust","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"},{"variant":"frust","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","cpu":"v3"}]'
  workflow_call:
    inputs:
      rebuild:
        type: boolean
        default: false
      codegen-cache:
        type: boolean
        default: true
      relr:
        type: boolean
        default: true
      builds:
        type: string
        default: '[{"variant":"control","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"},{"variant":"frust","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04"},{"variant":"frust","target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","cpu":"v3"}]'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.variant }}${{ matrix.cpu == 'v3' && ' v3' || '' }}${{ matrix.pgo == 'rustc' && ' pgo' || '' }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The upstream-matched recipe (one codegen unit, thin LTO) is slower to build than the stock one.
    # 355 keeps a few minutes of the 360 minute hosted-runner limit for GitHub's own job teardown.
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.builds) }}
    env:
      # The fRust toolchain on Linux x86-64 is the one built by the optimized recipe.
      OPTIMIZED: ${{ matrix.variant == 'frust' && matrix.target == 'x86_64-unknown-linux-gnu' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      # NAME tells the builds of one target apart in archive, artifact and cache names. Only the v3
      # variant has a suffix, so the baseline keeps the names that Benchmark and Release look for.
      - id: name
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
          CPU: ${{ matrix.cpu }}
          PGO: ${{ matrix.pgo }}
        run: |
          name=$VARIANT
          case $PGO in
            '') ;;
            rustc)
              if [[ $VARIANT != frust || $TARGET != *-apple-darwin || -n $CPU ]]; then
                echo "::error::pgo is only for the fRust toolchain on the macOS targets, not $VARIANT on $TARGET${CPU:+ ($CPU)}"
                exit 1
              fi
              name=$VARIANT-pgo
              ;;
            *)
              echo "::error::unknown pgo $PGO, expected rustc"
              exit 1
              ;;
          esac
          case $CPU in
            '') ;;
            baseline | v3)
              if [[ $VARIANT != frust || $TARGET != x86_64-unknown-linux-gnu ]]; then
                echo "::error::cpu is only for the fRust toolchain on x86_64-unknown-linux-gnu, not $VARIANT on $TARGET"
                exit 1
              fi
              [[ $CPU == v3 ]] && name=$VARIANT-v3
              ;;
            *)
              echo "::error::unknown cpu $CPU, expected baseline or v3"
              exit 1
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE=$RUNNER_TEMP/$name-$TARGET.tar.zst" >> "$GITHUB_ENV"
      # The v3 toolchain runs on the machine that builds it: the packaging step starts its rustc and
      # cargo, then the launch check and the parity proof use it. A runner without the extensions
      # cannot produce a verified artifact, so the job stops here rather than after hours of building.
      - name: Require an x86-64-v3 CPU
        if: matrix.cpu == 'v3'
        run: bash .github/scripts/cpu-supports-v3.sh
      # A toolchain is rebuilt only when its recipe, patches or packaging inputs change. The recipe
      # is the lock, every support/bootstrap*.toml (base, common, Linux and macOS settings) and the
      # build script that sets the compiler environment and applies them. The optimized Linux recipe
      # adds its script, its helper tools, the build patches and the lock of the build assets.
      - id: key
        env:
          NAME: ${{ steps.name.outputs.name }}-${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          RECIPE: ${{ hashFiles('support/upstream.lock', 'support/bootstrap*.toml', '.github/scripts/build-toolchain.sh') }}
          PATCHES: ${{ hashFiles('support/patches/*.patch', 'support/patches/rustc/*.patch', 'support/package-toolchain.sh', 'support/package-tools.sh', 'support/apply-patches.sh', 'support/apply-rustc-patches.sh', 'crates/**/*.rs', 'crates/**/Cargo.*') }}
          OPTIMIZED_INPUTS: ${{ hashFiles('support/optimize-linux-v2.sh', 'support/tools/**', 'support/patches/build/**', 'support/build-assets.lock', 'support/fetch-build-assets.sh', 'support/verify-pins.sh') }}
          PGO: ${{ matrix.pgo }}
          PGO_INPUTS: ${{ hashFiles('.github/scripts/build-toolchain-pgo.sh', 'support/tools/pgo-rustc-*.py', 'support/patches/build/**', 'qualification/cohorts.lock') }}
        run: |
          if [[ $VARIANT != frust ]]; then
            echo "value=toolchain-$NAME-$RECIPE" >> "$GITHUB_OUTPUT"
          elif [[ $PGO == rustc ]]; then
            echo "value=toolchain-$NAME-$RECIPE-$PATCHES-$PGO_INPUTS" >> "$GITHUB_OUTPUT"
          elif [[ $OPTIMIZED == true ]]; then
            echo "value=toolchain-$NAME-$RECIPE-$PATCHES-$OPTIMIZED_INPUTS" >> "$GITHUB_OUTPUT"
          else
            echo "value=toolchain-$NAME-$RECIPE-$PATCHES" >> "$GITHUB_OUTPUT"
          fi
      - id: cache
        if: ${{ !inputs.rebuild }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ARCHIVE }}
          key: ${{ steps.key.outputs.value }}
      # The key hashes every input of the build and of the packaging, so a toolchain from before
      # clippy and rustfmt were built (the 0.5.1 recipe) cannot match it. This looks inside a cached
      # archive anyway, and stops the job rather than let a tree without the tools reach the release.
      # The fix for a stale entry is to run again with rebuild set.
      - name: Require clippy and rustfmt in a cached toolchain
        if: steps.cache.outputs.cache-hit == 'true' && matrix.variant == 'frust'
        run: |
          zstd -dc "$ARCHIVE" | tar -tf - > "$RUNNER_TEMP/cached-files.txt"
          missing=0
          for tool in cargo cargo-clippy clippy-driver rustfmt cargo-fmt; do
            if ! grep -Eq "^(\./)?frust/bin/$tool\$" "$RUNNER_TEMP/cached-files.txt"; then
              echo "::error::the cached toolchain has no bin/$tool; run again with rebuild set"
              missing=1
            fi
          done
          rm -f "$RUNNER_TEMP/cached-files.txt"
          exit "$missing"
      # The optimized build keeps the checkout, the build tree, the unpacked assets and Cargo's
      # build on /mnt, which has the room that the system disk lacks.
      - name: Make room on Linux
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/build
          sudo chown "$USER" /mnt/build
          echo "BUILD_DIR=/mnt/build" >> "$GITHUB_ENV"
          df -h / /mnt
      # The macOS runner disk is small. Keep the selected Xcode and drop the rest.
      - name: Make room on macOS
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          selected=$(xcode-select -p | sed 's|/Contents/Developer$||')
          for app in /Applications/Xcode*.app; do
            [[ $app == "$selected" ]] || sudo rm -rf "$app"
          done
          sudo rm -rf "$HOME/Library/Android" "$HOME/Library/Developer/CoreSimulator"
          mkdir -p "$RUNNER_TEMP/build"
          echo "BUILD_DIR=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
          command -v zstd > /dev/null || brew install zstd
          df -h /
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && env.OPTIMIZED != 'true'
        run: sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # The optimized recipe brings its own clang, lld and LLVM tools (the build tools bundle), so no
      # compiler is installed from apt. It needs a few more tools of its own: zstd and curl for the
      # bundles, python3 and git for bootstrap and the checkout, binutils for strip and readelf,
      # make and perl for the vendored C dependencies of Cargo, cmake and ninja in case bootstrap
      # has to build a part of LLVM itself, and libssl-dev and pkg-config for the Cargo build.
      - name: Install build dependencies for the optimized recipe
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && env.OPTIMIZED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config zstd curl python3 git binutils make perl cmake ninja-build
      # The control and the generic recipe build with clang and link with lld, as upstream's Linux dist
      # image does, and bootstrap compiles the C parts of rustc with -flto=thin. The linker has to read
      # that bitcode, so lld must be the same LLVM version as clang or newer. On ubuntu-24.04 the
      # packages clang, lld and llvm are all version 18.1.x. Install them only when a tool is missing,
      # then print the versions. build-toolchain.sh checks them again and fails early on a mismatch.
      - name: Install clang and lld
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux' && env.OPTIMIZED != 'true'
        run: |
          missing=0
          for tool in clang clang++ lld ld.lld llvm-ar; do
            command -v "$tool" > /dev/null || missing=1
          done
          if [[ $missing == 1 ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang lld llvm
          fi
          clang --version
          ld.lld --version
      # The optimized recipe builds Cargo with official Rust, the control builds nothing with it.
      - uses: ./.github/actions/setup-rust
        if: steps.cache.outputs.cache-hit != 'true' && matrix.variant == 'frust'
      - name: Build and pack
        if: steps.cache.outputs.cache-hit != 'true' && matrix.pgo != 'rustc'
        env:
          CPU: ${{ matrix.cpu }}
        run: .github/scripts/build-toolchain.sh "${{ matrix.variant }}" "$BUILD_DIR" "$ARCHIVE" "${{ matrix.target }}" "$CPU"
      # The candidate recipe: instrumented build, native training, checked profile-use build. It packs
      # only when its evidence passes, so a failed profile fails this job and uploads no archive.
      - name: Build and pack with rustc PGO
        if: steps.cache.outputs.cache-hit != 'true' && matrix.pgo == 'rustc'
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/build-toolchain-pgo.sh "$BUILD_DIR" "$ARCHIVE" "$TARGET"
      # The summary, the evidence, the training logs and the build logs are what explain a profile that
      # was refused or a toolchain that turned out slower, so they are kept for every run that built.
      - name: PGO evidence summary
        if: always() && matrix.pgo == 'rustc'
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [[ $CACHE_HIT == true ]]; then
            echo "### Native rustc PGO candidate, ${{ matrix.target }}: served from the cache, so this run produced no PGO evidence. Run again with rebuild set to regenerate it." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f $BUILD_DIR/pgo/summary.md ]]; then
            cat "$BUILD_DIR/pgo/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Native rustc PGO candidate, ${{ matrix.target }}: stopped before the first evidence summary was written. See the build log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.cache.outputs.cache-hit != 'true' && matrix.pgo == 'rustc'
        with:
          name: pgo-evidence-${{ steps.name.outputs.name }}-${{ matrix.target }}
          path: |
            ${{ env.BUILD_DIR }}/pgo/evidence.json
            ${{ env.BUILD_DIR }}/pgo/summary.md
            ${{ env.BUILD_DIR }}/pgo/MANIFEST
            ${{ env.BUILD_DIR }}/pgo/profiles/rustc-pgo.profdata
            ${{ env.BUILD_DIR }}/pgo/progress.log
            ${{ env.BUILD_DIR }}/pgo/logs/*.log
            ${{ env.BUILD_DIR }}/pgo/train/logs/*.log
          if-no-files-found: ignore
          retention-days: 14
      # What the build used and what it left, so a runner that runs short of disk is seen in the log
      # before it fails: clippy and rustfmt add two more tools to build and link than the 0.5.1 recipe did.
      - name: Disk after the build
        if: always() && steps.cache.outputs.cache-hit != 'true'
        run: |
          df -h /
          if [[ -d /mnt ]]; then df -h /mnt; fi
          if [[ -n ${BUILD_DIR:-} && -d $BUILD_DIR ]]; then du -sh "$BUILD_DIR" || true; fi
      # The build logs stay in the work directory of the optimized recipe. They are what explains a
      # failure after hours of building, so a failed or cancelled run uploads them.
      - uses: actions/upload-artifact@v7
        if: ${{ !success() && steps.cache.outputs.cache-hit != 'true' && env.OPTIMIZED == 'true' }}
        with:
          name: build-logs-${{ steps.name.outputs.name }}-${{ matrix.target }}
          path: |
            ${{ env.BUILD_DIR }}/opt/*.log
            ${{ env.BUILD_DIR }}/opt/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/cache/save@v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.ARCHIVE }}
          key: ${{ steps.key.outputs.value }}
      - name: Unpack the toolchain
        if: matrix.variant == 'frust'
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          zstd -dc "$ARCHIVE" | tar -xf - -C "$RUNNER_TEMP/unpacked"
      - name: Launch the packaged toolchain with no ambient state
        if: matrix.variant == 'frust'
        run: |
          mkdir -p "$RUNNER_TEMP/launch"
          support/launch-check.sh "$RUNNER_TEMP/unpacked/frust" "$RUNNER_TEMP/launch" "$RUNNER_TEMP/launch/launch.log"
          cat "$RUNNER_TEMP/launch/launch.log"
      # The tree that the build packed is used the way a user uses an installed toolchain: build, test, check,
      # clippy (and a lint it must reject), rustfmt (and a file it must reject), doc, doctests, frust where, the
      # unit cache and a library build for the target. The installer, rust-analyzer, rust-docs and the extra std
      # targets are added when the release is packaged, and the release job runs the whole suite on them
      # (FRUST_SUITE_SCOPE=release). A failed check does not stop the suite: the log lists every failure.
      - name: Validate the packaged toolchain
        if: matrix.variant == 'frust'
        env:
          FRUST_SUITE_SCOPE: built
        run: |
          mkdir -p "$RUNNER_TEMP/suite-output"
          # The default shell has no pipefail, so the status is kept here and not taken from a pipe.
          status=0
          support/toolchain-suite.sh "$RUNNER_TEMP/unpacked/frust" "$RUNNER_TEMP/suite" > "$RUNNER_TEMP/suite-output/suite.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/suite-output/suite.txt"
          {
            echo "### Validation suite, ${{ matrix.target }}${{ matrix.cpu == 'v3' && ' v3' || '' }}"
            echo "passed: $(grep -c '^PASS' "$RUNNER_TEMP/suite-output/suite.txt" || true), failed: $(grep -c '^FAIL' "$RUNNER_TEMP/suite-output/suite.txt" || true), skipped: $(grep -c '^SKIP' "$RUNNER_TEMP/suite-output/suite.txt" || true)"
            sed -n '/^FAILED CHECKS:/,$p' "$RUNNER_TEMP/suite-output/suite.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Prove fat LTO, codegen units and warm-fresh parity
        if: matrix.variant == 'frust' && runner.os == 'Linux'
        env:
          FRUST_EXPERIMENTAL_CODEGEN_CACHE: ${{ inputs.codegen-cache && '1' || '0' }}
          FRUST_EXPERIMENTAL_RELR: ${{ inputs.relr && '1' || '0' }}
          LABEL: ci-${{ steps.name.outputs.name }}
        run: qualification/prove-codegen.sh "$RUNNER_TEMP/unpacked/frust" "$LABEL"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.variant == 'frust'
        with:
          name: verify-logs-${{ steps.name.outputs.name }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/launch/launch.log
            ${{ runner.temp }}/suite-output/suite.txt
            ${{ runner.temp }}/suite/logs/**
            target/compiler-rewrite/parity/ci-${{ steps.name.outputs.name }}/prove.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ steps.name.outputs.name }}-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          compression-level: 0
          retention-days: 7
