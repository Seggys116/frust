name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Every job is independent so the slowest one sets the wall time. The final `ci` job is the single required check.
jobs:
  diff:
    name: diff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: git diff --check HEAD^ HEAD

  svg:
    name: svg assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/assets
      - run: |
          python3 -I - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for asset in sorted(Path(".github/assets").glob("*.svg")):
              if ElementTree.parse(asset).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG root in {asset}")
          PY

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            support
            qualification
      - name: Syntax with each script's own interpreter
        run: |
          for script in .github/scripts/*.sh support/*.sh qualification/*.sh; do
            interpreter=$(head -n 1 "$script" | sed 's|^#! */\(usr/\)\?bin/\(env \)\?||')
            "$interpreter" -n "$script"
          done
      # Info and style findings stay advisory; errors fail the job.
      - run: shellcheck -x -S error .github/scripts/*.sh support/*.sh qualification/*.sh

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  corpus:
    name: runtime corpus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: qualification
      - name: Regenerate and compare with the frozen manifest
        run: |
          python3 -I qualification/make_corpus.py "$RUNNER_TEMP/corpus" --manifest "$RUNNER_TEMP/corpus.sha256"
          cmp "$RUNNER_TEMP/corpus.sha256" qualification/corpus.sha256
          grep -q "$(sha256sum qualification/corpus.sha256 | cut -d' ' -f1)" qualification/CORPUS.md
      - name: Benchmark scripts compile
        run: python3 -I -m py_compile qualification/run-pairs.py qualification/run-runtime.py qualification/make_corpus.py qualification/ci-bench.py qualification/make-charts.py

  upstream:
    name: upstream pins and patches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            support
      - name: Fetch the pinned sources
        run: .github/scripts/fetch-upstream.sh "$RUNNER_TEMP/rust"
      - name: Verify pins and notices
        run: support/verify-pins.sh "$RUNNER_TEMP/rust"
      - name: Apply compiler patches
        run: FRUST_RUST_SRC="$RUNNER_TEMP/rust" support/apply-rustc-patches.sh
      - name: Apply Cargo patches
        run: FRUST_CARGO_SRC="$RUNNER_TEMP/rust/src/tools/cargo" support/apply-patches.sh

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # Deny-level lints fail the job; warn-level findings are not gated until the existing ones are cleaned up.
      - run: cargo clippy --workspace --all-targets --locked
        working-directory: crates

  rustdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo doc --workspace --no-deps --locked
        working-directory: crates
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      # The CLI tests call sha256sum, which macOS does not ship.
      - name: Provide sha256sum
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/shim/sha256sum"
          chmod +x "$RUNNER_TEMP/shim/sha256sum"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - run: cargo test --workspace --locked --no-fail-fast
        working-directory: crates

  package:
    name: crate packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo package --workspace --locked
        working-directory: crates

  cross:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
        working-directory: crates

  ci:
    name: ci
    if: always()
    needs: [diff, svg, shell, workflows, corpus, upstream, clippy, rustdoc, test, package, cross]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ " $RESULTS " != *" failure "* && " $RESULTS " != *" cancelled "* && " $RESULTS " != *" skipped "* ]]
