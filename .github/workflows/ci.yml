name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check diff and SVG assets
        run: |
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for asset in sorted(Path(".github/assets").glob("*.svg")):
              if ElementTree.parse(asset).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"Invalid SVG root in {asset}")
          PY
