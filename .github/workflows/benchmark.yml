name: Benchmark

# Manual. Two independent measurements on GitHub-hosted runners.
#
# 1. The frozen qualification protocol (qualification/PROTOCOL.md) on Linux x86-64: paired
#    control and fRust builds, runtime and stripped size, then the release gates.
# 2. The official comparison: official Rust (rustup, minimal profile, pinned to OFFICIAL_RELEASE)
#    against the fRust toolchain with its Cargo unit cache, on Linux x86-64 (the baseline build and
#    the x86-64-v3 build, each against official), macOS arm64 and macOS x86-64, with the cohort
#    sources locked by qualification/cohorts.lock. Scenarios are cold, clean rebuild, no-op and edit
#    rebuild, reported as fRust CPU as a percent of official CPU. The report job turns the raw
#    results into a markdown table and SVG charts and uploads them. It commits nothing: numbers are
#    published only from a completed run, by hand.
#    The regex job of each platform also runs a short paired contention matrix after its comparison
#    (qualification/concurrent-builds.py --preset ci) and uploads its machine-readable results beside
#    the comparison results. It is not part of the table, so it needs regex among the cohorts.
#
# Both toolchains of the comparison are installed the way users get them. Official comes from
# rustup. fRust is packed into the release archive format by .github/scripts/package-release.sh,
# the script of the Release workflow, and installed by frust-install --archive, which is the
# user path. This matters for more than hygiene: whether the compiler gets 2 MiB pages for its
# libraries depends on how the files were written (rustup writes in large chunks, tar in small
# ones, and frust-install rewrites large files with large writes after extraction), so unpacking
# with tar would measure a state no user has. Every job records that state for both toolchains
# before the first timed build and after the last (the folio records of the results, written by
# qualification/ci-bench.py with qualification/toolchain-folio-state.py). The cache-state input
# chooses between measuring the toolchains as installed and evicting the library pages of both
# before every timed build, which compares the compilers alone.
#
# The v3 build needs a CPU with the x86-64-v3 extensions. A compare job on a runner without them
# says so in a warning and in the run summary, runs nothing, and leaves a record that the report
# lists in its run notes.
#
# Candidate platforms, never in the default list: macos-arm64-pgo and macos-x86_64-pgo measure the
# optional rustc-PGO build of the macOS toolchain (.github/scripts/build-toolchain-pgo.sh, trained
# natively in the same build) against official, exactly as macos-arm64 and macos-x86_64 do. They use
# their own toolchains job, artifact (toolchain-frust-pgo-<target>), cache key and report label, so
# the default comparison and the release toolchains are untouched. Each builds for about four hours
# before it is measured, and a profile that fails its evidence checks fails that build.
#
# Unit cache store rules, which keep a cold fRust build from ever being served by an earlier pair
# or round. The fRust store lives in a directory the driver owns (FRUST_HOME), never in the
# runner's default cache directory. Cold: the store is deleted and checked empty before every
# fRust build. Clean rebuild: the store is emptied, filled by a cold build of the same pair, and
# the target is then removed. The official toolchain has no store. A cold build that leaves the
# isolated store empty fails the job.
#
# Shared runners are noisy, and the hardware differs from job to job. Each job records its CPU
# model, OS, toolchain versions and commit, and both toolchains of a pair run on the same runner,
# so the ratio does not depend on the runner. A result here is a reproducible check of the
# pipeline and of the ratios on that hardware. It does not replace dated host evidence.
on:
  workflow_dispatch:
    inputs:
      protocol:
        description: Run the frozen pair protocol, runtime and size jobs and the release gates (Linux x86-64)
        type: boolean
        default: true
      pairs:
        description: Pairs per series and runtime runs per workload. The gates need 30. Leaf and wide series use twice as many pairs (the tail gate needs 60) and the clean series uses a third, at least 1.
        default: "30"
      unit-cache:
        description: Cargo unit cache for the fRust side of the protocol jobs
        type: boolean
        default: true
      cohorts:
        description: Workloads for the official comparison, space separated (ripgrep syn regex fd)
        default: "ripgrep syn regex fd"
      platforms:
        description: Platforms for the official comparison, space separated (linux linux-v3 macos-arm64 macos-x86_64; candidates macos-arm64-pgo macos-x86_64-pgo, off by default)
        default: "linux linux-v3 macos-arm64 macos-x86_64"
      rounds:
        description: Rounds per scenario in the official comparison. One round is one pair. A job stops cleanly at its time budget and the report says so.
        default: "8"
      noops:
        description: No-op builds per round in the official comparison. The median is the sample.
        default: "5"
      cache-state:
        description: Page-cache state of the toolchains in the official comparison. evicted drops both toolchains' library pages before every build (Linux only)
        type: choice
        options:
          - installed
          - evicted
        default: installed
      rebuild-toolchains:
        description: Ignore cached toolchains and build them again
        type: boolean
        default: false
      enforce:
        description: Fail the run when a gate fails (turn off for smoke runs with few pairs)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}-${{ contains(inputs.platforms, '-pgo') && 'pgo' || 'release' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The official toolchain of the comparison. It is installed with exactly this version.
  OFFICIAL_RELEASE: "1.100.0"
  FRUST_ENV: >-
    --frust-env FRUST_EXPERIMENTAL_CODEGEN_CACHE=1
    --frust-env FRUST_EXPERIMENTAL_RELR=1

jobs:
  # Validates the inputs and turns them into the toolchain builds and the comparison matrix.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      linux-builds: ${{ steps.plan.outputs.linux-builds }}
      v3-builds: ${{ steps.plan.outputs.v3-builds }}
      mac-builds: ${{ steps.plan.outputs.mac-builds }}
      mac-pgo-builds: ${{ steps.plan.outputs.mac-pgo-builds }}
      run-linux: ${{ steps.plan.outputs.run-linux }}
    steps:
      - id: plan
        env:
          COHORTS: ${{ inputs.cohorts }}
          PLATFORMS: ${{ inputs.platforms }}
          PROTOCOL: ${{ inputs.protocol }}
          CACHE_STATE: ${{ inputs.cache-state }}
          ROUNDS: ${{ inputs.rounds }}
          NOOPS: ${{ inputs.noops }}
        run: |
          python3 -I - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os

          # toolchain is the name of the artifact the Toolchains workflow uploads (toolchain-<toolchain>-<target>)
          # and cpu is what package-release.sh records as the variant; it is empty where there is no choice.
          PLATFORMS = {
              "linux": {
                  "label": "linux-x86_64", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu",
                  "toolchain": "frust", "cpu": "baseline",
              },
              "linux-v3": {
                  "label": "linux-x86_64-v3", "os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu",
                  "toolchain": "frust-v3", "cpu": "v3",
              },
              "macos-arm64": {
                  "label": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin",
                  "toolchain": "frust", "cpu": "",
              },
              "macos-x86_64": {
                  "label": "macos-x86_64", "os": "macos-15-intel", "target": "x86_64-apple-darwin",
                  "toolchain": "frust", "cpu": "",
              },
              # Candidates: the rustc-PGO macOS build, in its own artifact (toolchain-frust-pgo-<target>).
              "macos-arm64-pgo": {
                  "label": "macos-arm64-pgo", "os": "macos-latest", "target": "aarch64-apple-darwin",
                  "toolchain": "frust-pgo", "cpu": "", "pgo": "rustc",
              },
              "macos-x86_64-pgo": {
                  "label": "macos-x86_64-pgo", "os": "macos-15-intel", "target": "x86_64-apple-darwin",
                  "toolchain": "frust-pgo", "cpu": "", "pgo": "rustc",
              },
          }
          CACHE_STATES = ("installed", "evicted")
          # The build-time cohort of qualification/PROTOCOL.md. Each has frozen edits in qualification/edits.
          WORKLOADS = ("ripgrep", "syn", "regex", "fd")


          def choose(name, allowed, empty_ok):
              chosen = []
              for item in os.environ[name].split():
                  if item not in allowed:
                      raise SystemExit(f"unknown {name.lower()} entry {item!r}, expected one of {', '.join(allowed)}")
                  if item not in chosen:
                      chosen.append(item)
              if not chosen and not empty_ok:
                  raise SystemExit(f"{name.lower()} is empty")
              return chosen


          if os.environ["CACHE_STATE"] not in CACHE_STATES:
              raise SystemExit(f"unknown cache-state {os.environ['CACHE_STATE']!r}, expected one of {', '.join(CACHE_STATES)}")
          for name in ("ROUNDS", "NOOPS"):
              if not os.environ[name].isdigit() or int(os.environ[name]) < 1:
                  raise SystemExit(f"{name.lower()} must be a whole number of at least 1, got {os.environ[name]!r}")
          platforms = choose("PLATFORMS", tuple(PLATFORMS), True)
          workloads = choose("COHORTS", WORKLOADS, bool(not platforms))
          matrix = [
              dict(PLATFORMS[platform], workload=workload) for platform in platforms for workload in workloads
          ]
          mac = [
              {"variant": "frust", "target": PLATFORMS[p]["target"], "os": PLATFORMS[p]["os"]}
              for p in platforms
              if p.startswith("macos") and not PLATFORMS[p].get("pgo")
          ]
          # The candidates are built by their own call of the Toolchains workflow, so that a refused
          # profile or a timeout only affects the pgo platforms.
          mac_pgo = [
              {"variant": "frust", "target": PLATFORMS[p]["target"], "os": PLATFORMS[p]["os"], "pgo": PLATFORMS[p]["pgo"]}
              for p in platforms
              if PLATFORMS[p].get("pgo")
          ]
          linux_target, linux_os = PLATFORMS["linux"]["target"], PLATFORMS["linux"]["os"]
          linux = [{"variant": "frust", "target": linux_target, "os": linux_os}]
          if os.environ["PROTOCOL"] == "true":
              linux.insert(0, {"variant": "control", "target": linux_target, "os": linux_os})
          # The v3 toolchain is built by its own call of the Toolchains workflow, so a runner that cannot
          # build it (it needs the x86-64-v3 extensions) does not take the baseline comparison down with it.
          v3 = [{"variant": "frust", "target": linux_target, "os": linux_os, "cpu": "v3"}] if "linux-v3" in platforms else []


          def dump(value):
              return json.dumps(value, separators=(",", ":"))


          print(f"matrix={dump(matrix)}")
          print(f"linux-builds={dump(linux)}")
          print(f"v3-builds={dump(v3)}")
          print(f"mac-builds={dump(mac)}")
          print(f"mac-pgo-builds={dump(mac_pgo)}")
          print(f"run-linux={'true' if 'linux' in platforms else 'false'}")
          PY

  toolchains:
    needs: plan
    if: ${{ inputs.protocol || needs.plan.outputs.run-linux == 'true' }}
    uses: ./.github/workflows/toolchains.yml
    with:
      rebuild: ${{ inputs.rebuild-toolchains }}
      codegen-cache: true
      relr: true
      builds: ${{ needs.plan.outputs.linux-builds }}

  # The x86-64-v3 fRust toolchain, for the linux-v3 platform. It has its own call so that a failed
  # v3 build only affects the v3 comparison. The protocol jobs never use it: the setup action
  # unpacks every toolchain artifact of the run, and they put the baseline toolchain back as built.
  toolchains-v3:
    needs: plan
    if: ${{ needs.plan.outputs.v3-builds != '[]' }}
    uses: ./.github/workflows/toolchains.yml
    with:
      rebuild: ${{ inputs.rebuild-toolchains }}
      codegen-cache: true
      relr: true
      builds: ${{ needs.plan.outputs.v3-builds }}

  # The macOS toolchains are the shipped fRust ones, built natively like the release does. The
  # official comparison needs no control toolchain.
  toolchains-macos:
    needs: plan
    if: ${{ needs.plan.outputs.mac-builds != '[]' }}
    uses: ./.github/workflows/toolchains.yml
    with:
      rebuild: ${{ inputs.rebuild-toolchains }}
      codegen-cache: false
      relr: false
      builds: ${{ needs.plan.outputs.mac-builds }}

  # The rustc-PGO candidates of the macOS platforms (macos-arm64-pgo, macos-x86_64-pgo). Their own
  # call, like the v3 one, so that a refused profile or a timeout only affects the pgo platforms.
  toolchains-macos-pgo:
    needs: plan
    if: ${{ needs.plan.outputs.mac-pgo-builds != '[]' }}
    uses: ./.github/workflows/toolchains.yml
    with:
      rebuild: ${{ inputs.rebuild-toolchains }}
      codegen-cache: false
      relr: false
      builds: ${{ needs.plan.outputs.mac-pgo-builds }}

  # One runner per series. Both toolchains of a pair run on the same runner, so the ratio is
  # not affected by differences between runners.
  build-time:
    name: ${{ matrix.workload }} ${{ matrix.name }}
    needs: toolchains
    if: ${{ inputs.protocol }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workload: ripgrep, name: leaf, kinds: "leaf:tail" }
          - { workload: ripgrep, name: wide, kinds: "wide:tail" }
          - { workload: ripgrep, name: cold, kinds: "cold:main" }
          - { workload: ripgrep, name: "no-op, clean and resources", kinds: "noop:main trace:main clean:clean" }
          - { workload: syn, name: leaf, kinds: "leaf:tail" }
          - { workload: syn, name: wide, kinds: "wide:tail" }
          - { workload: syn, name: cold, kinds: "cold:main" }
          - { workload: syn, name: "no-op, clean and resources", kinds: "noop:main trace:main clean:clean" }
          - { workload: regex, name: leaf, kinds: "leaf:tail" }
          - { workload: regex, name: wide, kinds: "wide:tail" }
          - { workload: regex, name: cold, kinds: "cold:main" }
          - { workload: regex, name: "no-op, clean and resources", kinds: "noop:main trace:main clean:clean" }
          - { workload: fd, name: holdout, kinds: "holdout:main" }
          - { workload: fd, name: cold, kinds: "cold:main" }
          - { workload: fd, name: "no-op, clean and resources", kinds: "noop:main trace:main clean:clean" }
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/bench-setup
        with:
          workloads: ${{ matrix.workload }}
      # The setup action unpacks every toolchain-* artifact of the run, and the macOS fRust
      # toolchains and the Linux v3 one share the name of the top directory with the baseline
      # Linux one. Put the baseline Linux fRust toolchain back exactly as built, so nothing else
      # can be mixed into it.
      - name: Restore the Linux fRust toolchain
        run: |
          dest=target/compiler-rewrite/toolchains
          rm -rf "${dest:?}/frust"
          zstd -dc "$RUNNER_TEMP/toolchains/frust-x86_64-unknown-linux-gnu.tar.zst" | tar -xf - -C "$dest"
          ls -l "$dest/frust/bin"
      - name: Collect paired samples
        env:
          WORKLOAD: ${{ matrix.workload }}
          KINDS: ${{ matrix.kinds }}
          PAIRS_MAIN: ${{ inputs.pairs }}
          UNIT_CACHE: ${{ inputs.unit-cache && 'on' || 'off' }}
          WORK: ${{ steps.setup.outputs.work }}
        run: |
          tail_pairs=$((PAIRS_MAIN * 2))
          clean_pairs=$(((PAIRS_MAIN + 2) / 3))
          toolchains=$PWD/target/compiler-rewrite/toolchains
          for entry in $KINDS; do
            kind=${entry%%:*}
            case ${entry##*:} in
              tail) pairs=$tail_pairs ;;
              clean) pairs=$clean_pairs ;;
              *) pairs=$PAIRS_MAIN ;;
            esac
            # shellcheck disable=SC2086
            python3 -I qualification/run-pairs.py --control "$toolchains/control/bin" --frust "$toolchains/frust/bin" \
              --workload "$WORKLOAD" --kind "$kind" --pairs "$pairs" --work "$WORK/$kind" \
              --samples "$WORK/samples.txt" --jsonl "$WORK/results.jsonl" --unit-cache "$UNIT_CACHE" $FRUST_ENV
          done
      - name: Stage results
        if: always()
        env:
          WORK: ${{ steps.setup.outputs.work }}
        run: |
          mkdir -p "$RUNNER_TEMP/out/logs"
          cp "$WORK/samples.txt" "$RUNNER_TEMP/out/" || true
          cp "$WORK/results.jsonl" "$RUNNER_TEMP/out/" || true
          cp "$RUNNER_TEMP/environment.txt" "$RUNNER_TEMP/out/"
          for dir in "$WORK"/*/logs; do
            [[ -d $dir ]] || continue
            kind=$(basename "$(dirname "$dir")")
            mkdir -p "$RUNNER_TEMP/out/logs/$kind"
            cp -r "$dir/." "$RUNNER_TEMP/out/logs/$kind/"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: samples-${{ matrix.workload }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  runtime:
    name: runtime and size (${{ matrix.workload }})
    needs: toolchains
    if: ${{ inputs.protocol }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        workload: [ripgrep, rustfmt, oxipng]
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/bench-setup
        with:
          workloads: ${{ matrix.workload }}
      - name: Restore the Linux fRust toolchain
        run: |
          dest=target/compiler-rewrite/toolchains
          rm -rf "${dest:?}/frust"
          zstd -dc "$RUNNER_TEMP/toolchains/frust-x86_64-unknown-linux-gnu.tar.zst" | tar -xf - -C "$dest"
          ls -l "$dest/frust/bin"
      - name: Write and check the frozen corpus
        env:
          WORK: ${{ steps.setup.outputs.work }}
        run: |
          python3 -I qualification/make_corpus.py "$WORK/corpus" --manifest "$WORK/corpus.sha256"
          cmp "$WORK/corpus.sha256" qualification/corpus.sha256
      - name: Build both toolchains' binaries and time them
        env:
          WORKLOAD: ${{ matrix.workload }}
          RUNS: ${{ inputs.pairs }}
          WORK: ${{ steps.setup.outputs.work }}
        run: |
          toolchains=$PWD/target/compiler-rewrite/toolchains
          # shellcheck disable=SC2086
          python3 -I qualification/run-runtime.py --control "$toolchains/control/bin" --frust "$toolchains/frust/bin" \
            --workload "$WORKLOAD" --corpus "$WORK/corpus" --work "$WORK/run" --samples "$WORK/samples.txt" \
            --runs "$RUNS" $FRUST_ENV
      - name: Stage results
        if: always()
        env:
          WORK: ${{ steps.setup.outputs.work }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$WORK/samples.txt" "$RUNNER_TEMP/out/" || true
          cp "$RUNNER_TEMP/environment.txt" "$RUNNER_TEMP/out/"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: samples-runtime-${{ matrix.workload }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  gates:
    name: release gates
    needs: [build-time, runtime]
    if: ${{ !cancelled() && inputs.protocol }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: actions/download-artifact@v8
        with:
          pattern: samples-*
          path: ${{ runner.temp }}/samples
      - name: Judge the combined samples
        env:
          ENFORCE: ${{ inputs.enforce }}
        run: |
          (cd crates && cargo build --release --locked -p frust-rs --bin frust-gates)
          find "$RUNNER_TEMP/samples" -name samples.txt -exec cat {} + > "$RUNNER_TEMP/all-samples.txt"
          wc -l "$RUNNER_TEMP/all-samples.txt"
          status=0
          crates/target/release/frust-gates --samples "$RUNNER_TEMP/all-samples.txt" --output "$RUNNER_TEMP/gates.json" > /dev/null || status=$?
          python3 -I - "$RUNNER_TEMP/gates.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1]))
          print("## Release gates")
          print()
          print("Shared GitHub runner, advisory. See the workflow header for what this does and does not show.")
          print()
          print("| Gate | Status | Detail |")
          print("| --- | --- | --- |")
          for gate in report["gates"]:
              print(f"| {gate['name']} | {gate['status']} | {gate['detail']} |")
          print()
          for key, value in report.items():
              if key not in ("gates", "tail_p95"):
                  print(f"- {key}: {value}")
          for tail in report.get("tail_p95", []):
              print(f"- tail p95 {tail['name']}: {tail['p95']}")
          PY
          if [[ $ENFORCE == true ]]; then exit "$status"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gates
          path: |
            ${{ runner.temp }}/gates.json
            ${{ runner.temp }}/all-samples.txt
          if-no-files-found: ignore
          retention-days: 90

  # Official Rust against the fRust toolchain with its unit cache. One job per platform and
  # workload, so the largest job (rounds of cold, clean, no-op and edit builds with fat LTO)
  # stays well inside the six hour limit. The driver stops starting rounds at 285 minutes, which
  # leaves the setup before it (about 25 minutes at most) and the page-cache probe and upload after
  # it inside the 350 minute job limit, and the results then say how many pairs were taken. The
  # report lists every such stop, so a short series is never mistaken for a full one.
  compare:
    name: compare ${{ matrix.label }} ${{ matrix.workload }}
    needs: [plan, toolchains, toolchains-v3, toolchains-macos, toolchains-macos-pgo]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      # The v3 toolchain needs every x86-64-v3 extension. The runner pool is not guaranteed to have
      # them, so a runner without them reports that, leaves a record for the report and runs nothing
      # else. Every later step is conditional on runnable not being false; the steps of the other
      # platforms never set it, which counts as runnable.
      - id: cpu
        name: Check that this runner can run the v3 toolchain
        if: matrix.cpu == 'v3'
        env:
          LABEL: ${{ matrix.label }}
          WORKLOAD: ${{ matrix.workload }}
        run: |
          if message=$(bash .github/scripts/cpu-supports-v3.sh); then
            echo "runnable=true" >> "$GITHUB_OUTPUT"
            echo "$message"
          else
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=$LABEL skipped::$message. The v3 comparison for this workload was not run."
            echo "$LABEL $WORKLOAD was skipped: $message" >> "$GITHUB_STEP_SUMMARY"
            mkdir -p "$RUNNER_TEMP/out"
            python3 -I - "$LABEL" "$WORKLOAD" "$message" > "$RUNNER_TEMP/out/skipped.jsonl" <<'PY'
          import json
          import sys

          label, workload, message = sys.argv[1:]
          print(json.dumps({"schema": "frust-compare-1", "type": "skipped", "label": label, "workload": workload,
                            "reason": f"{message}, so the x86-64-v3 toolchain cannot run on this runner."}, sort_keys=True))
          PY
          fi
      - name: Require the toolchain build
        if: steps.cpu.outputs.runnable != 'false'
        env:
          RESULT: ${{ runner.os == 'Linux' && (matrix.toolchain == 'frust-v3' && needs.toolchains-v3.result || needs.toolchains.result) || (matrix.pgo == 'rustc' && needs.toolchains-macos-pgo.result || needs.toolchains-macos.result) }}
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [[ $RESULT != success ]]; then
            echo "::error::The $TOOLCHAIN toolchain build for $TARGET finished as $RESULT"
            exit 1
          fi
      - name: Choose the work directory
        if: steps.cpu.outputs.runnable != 'false'
        run: |
          if [[ $RUNNER_OS == Linux ]]; then
            # Targets, stores and seeded copies need more room than the system disk has.
            sudo mkdir -p /mnt/bench
            sudo chown "$USER" /mnt/bench
            echo "WORK=/mnt/bench" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/bench"
            echo "WORK=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"
          fi
      # frust-install is built here, with its target directory in the job's temporary area, and
      # then installs the toolchain the way a user's copy is installed.
      - uses: ./.github/actions/setup-rust
        if: steps.cpu.outputs.runnable != 'false'
      - name: Build frust-install
        if: steps.cpu.outputs.runnable != 'false'
        working-directory: crates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/frust-install-target
        run: cargo build --release --locked -p frust-rs --bin frust-install
      - uses: actions/download-artifact@v8
        if: steps.cpu.outputs.runnable != 'false'
        with:
          name: toolchain-${{ matrix.toolchain }}-${{ matrix.target }}
          path: ${{ runner.temp }}/toolchain
      # The archive carries the official components of its platform, which package-release.sh downloads
      # and checks against the pins of support/official-components.lock. The downloads are cached.
      - uses: actions/cache@v6
        if: steps.cpu.outputs.runnable != 'false'
        with:
          path: ${{ runner.temp }}/official-components
          key: official-components-${{ matrix.target }}-${{ hashFiles('support/official-components.lock') }}
      # The same script and arguments as the package job of the Release workflow, so the archive
      # has the release layout: manifest with the release id and variant, frust-install inside.
      - name: Package the release files
        if: steps.cpu.outputs.runnable != 'false'
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
          FRUST_OFFICIAL_CACHE: ${{ runner.temp }}/official-components
          CPU: ${{ matrix.cpu }}
        run: |
          command -v zstd > /dev/null || brew install zstd
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("crates/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          files=$RUNNER_TEMP/release-files
          .github/scripts/package-release.sh "$RUNNER_TEMP/toolchain/$TOOLCHAIN-$TARGET.tar.zst" "$version" "$TARGET" \
            "$RUNNER_TEMP/frust-install-target/release/frust-install" "$files" ${CPU:+"$CPU"}
          rm -f "$RUNNER_TEMP/toolchain/$TOOLCHAIN-$TARGET.tar.zst"
          suffix=
          if [[ $CPU == v3 ]]; then suffix=-v3; fi
          echo "RELEASE_ARCHIVE=$files/frust-toolchain-$TARGET$suffix.tar.gz" >> "$GITHUB_ENV"
          ls -l "$files"
      # The prefix is under the home directory, on the file system rustup uses for the official
      # toolchain. Its current/bin is the fRust toolchain that the driver measures.
      - name: Install the fRust toolchain with frust-install
        if: steps.cpu.outputs.runnable != 'false'
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          prefix=$HOME/frust-bench-prefix
          rm -rf "$prefix"
          "$RUNNER_TEMP/frust-install-target/release/frust-install" install \
            --archive "$RELEASE_ARCHIVE" --checksum "$RELEASE_ARCHIVE.sha256" --prefix "$prefix"
          rm -rf "$RUNNER_TEMP/release-files"
          if [[ -n $CPU ]]; then
            grep -F "\"variant\":\"$CPU\"" "$prefix/current/manifest.json"
          fi
          echo "FRUST_BIN=$prefix/current/bin" >> "$GITHUB_ENV"
          "$prefix/current/bin/fcargo" -V
          "$prefix/current/bin/frustc" -Vv
      - name: Install the official toolchain
        if: steps.cpu.outputs.runnable != 'false'
        run: |
          rustup toolchain install "$OFFICIAL_RELEASE" --profile minimal --no-self-update
          cargo_path=$(rustup which --toolchain "$OFFICIAL_RELEASE" cargo)
          bin=$(dirname "$cargo_path")
          echo "OFFICIAL_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/cargo" -V
          "$bin/rustc" -Vv
      # fetch-cohort.sh calls sha256sum, which macOS does not ship.
      - name: Provide sha256sum
        if: runner.os == 'macOS'
        run: |
          if ! command -v sha256sum > /dev/null; then
            mkdir -p "$RUNNER_TEMP/shims"
            cat > "$RUNNER_TEMP/shims/sha256sum" <<'SHIM'
          #!/bin/bash
          exec shasum -a 256 "$@"
          SHIM
            chmod +x "$RUNNER_TEMP/shims/sha256sum"
            echo "$RUNNER_TEMP/shims" >> "$GITHUB_PATH"
          fi
      # The registry is fetched with each toolchain's own Cargo, so both builds run --offline
      # against sources their Cargo can find.
      - name: Fetch the frozen cohort
        if: steps.cpu.outputs.runnable != 'false'
        env:
          WORKLOAD: ${{ matrix.workload }}
        run: |
          PATH="$OFFICIAL_BIN:$PATH" qualification/fetch-cohort.sh "$WORKLOAD" "$WORK/cohorts" "$OFFICIAL_BIN/cargo"
          (cd "$WORK/cohorts/$WORKLOAD" && PATH="$FRUST_BIN:$PATH" "$FRUST_BIN/cargo" fetch --locked)
      # The experimental switches are off: the comparison measures the shipped defaults. The driver
      # records the page-cache state of both toolchains before the first timed build and after the
      # last, and under cache-state evicted drops both toolchains' library pages before every build.
      - name: Measure
        if: steps.cpu.outputs.runnable != 'false'
        env:
          WORKLOAD: ${{ matrix.workload }}
          LABEL: ${{ matrix.label }}
          ROUNDS: ${{ inputs.rounds }}
          NOOPS: ${{ inputs.noops }}
          CACHE_STATE: ${{ inputs.cache-state }}
        run: |
          if [[ $CACHE_STATE == evicted && $RUNNER_OS != Linux ]]; then
            echo "::notice title=cache-state evicted ignored::Evicting the page cache needs Linux. $LABEL ran with the toolchains as installed."
            CACHE_STATE=installed
          fi
          mkdir -p "$RUNNER_TEMP/out"
          python3 -I qualification/ci-bench.py \
            --official-cargo "$OFFICIAL_BIN/cargo" --official-rustc "$OFFICIAL_BIN/rustc" \
            --expect-official-release "$OFFICIAL_RELEASE" \
            --frust-cargo "$FRUST_BIN/fcargo" --frust-rustc "$FRUST_BIN/frustc" \
            --frust-env FRUST_EXPERIMENTAL_CODEGEN_CACHE=0 --frust-env FRUST_EXPERIMENTAL_RELR=0 \
            --cache-state "$CACHE_STATE" \
            --app "$WORK/cohorts/$WORKLOAD" --label "$LABEL" --rounds "$ROUNDS" --noops "$NOOPS" \
            --time-budget-minutes 285 --work "$WORK/run" --out "$RUNNER_TEMP/out/results.jsonl"
      # Use the preceding fRust release as the control for resource changes. Both runs use the
      # same fixture paths and cache diagnostics. The .ndjson file keeps this series out of the
      # report's official CPU comparison, which reads *.jsonl.
      - name: Measure contention
        if: steps.cpu.outputs.runnable != 'false' && matrix.workload == 'regex'
        timeout-minutes: 20
        env:
          LABEL: ${{ matrix.label }}
          CPU: ${{ matrix.cpu }}
        run: |
          baseline=$HOME/frust-bench-control
          FRUST_VARIANT=${CPU:-auto} "$RUNNER_TEMP/frust-install-target/release/frust-install" install \
            --version 0.5.2 --prefix "$baseline"
          out=$RUNNER_TEMP/out/contention
          mkdir -p "$out"
          status=0
          python3 -I qualification/concurrent-builds.py \
            --a "control=$baseline/current/bin/fcargo,$baseline/current/bin/frustc" \
            --b "frust=$FRUST_BIN/fcargo,$FRUST_BIN/frustc" \
            --env FRUST_UNIT_CACHE=1 --env FRUST_UNIT_CACHE_DEBUG=1 \
            --env FRUST_EXPERIMENTAL_CODEGEN_CACHE=0 --env FRUST_EXPERIMENTAL_RELR=0 \
            --preset ci --states cold,warm,cache,edit --count 3 --rounds 8 --jobs 2 \
            --size 200 --timeout 600 --summary-only \
            --work "$WORK/contention" --out "$out/concurrent-builds.ndjson" > "$out/summary.txt" 2>&1 || status=$?
          if [[ $status == 0 ]]; then
            python3 -I qualification/tool-startup-bench.py --control "$baseline/current/bin" --frust "$FRUST_BIN" \
              --out "$out/tool-startup.ndjson" > "$out/startup-summary.txt" 2>&1 || status=$?
          fi
          {
            echo "### Contention check, $LABEL (exit $status)"
            echo '```'
            cat "$out/summary.txt"
            if [[ -f $out/startup-summary.txt ]]; then cat "$out/startup-summary.txt"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Stage results
        if: always() && steps.cpu.outputs.runnable != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/out/logs"
          cp -R "$WORK/run/logs/." "$RUNNER_TEMP/out/logs/" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compare-${{ matrix.label }}-${{ matrix.workload }}
          path: ${{ runner.temp }}/out
          retention-days: 90

  # Aggregates every compare job into one table and one chart per platform. Nothing is committed.
  report:
    name: report
    needs: compare
    if: ${{ !cancelled() && needs.compare.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: compare-*
          path: ${{ runner.temp }}/raw
      - name: Build the report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I qualification/make-charts.py "$RUNNER_TEMP/raw" --out "$RUNNER_TEMP/report" --run "$RUN_URL" --min-pairs 3
          cat "$RUNNER_TEMP/report/results.md" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/report"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report
          retention-days: 90
