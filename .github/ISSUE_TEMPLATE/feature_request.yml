name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that frust makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: Describe the behavior you want and how it would affect existing Rust or Cargo workflows.
