name: Bug report
description: Report a compatibility, correctness or performance issue
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include a small public reproducer or exact steps. If possible, repeat with the matching upstream Rust toolchain and include the result.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fRust version or commit, host and target
    validations:
      required: true
