<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" width="960" height="840" role="img" aria-labelledby="title description">
<title id="title">Build times on CI</title>
<desc id="description">bat on GitHub-hosted runners, milliseconds, lower is faster. GitHub Actions run 43099929391, commit f25f73e, rustc 1.99.1, median of 9 runs.</desc>
