<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="title description">
<title id="title">Debug build times</title>
<desc id="description">Median foreground milliseconds from seven runs; ranges are observed minima/maxima, not confidence intervals. Artifact-cold/page-warm; audit included. Warm is warm-session edit. Release uses canonical two-library clean restores; original flags retained.</desc>
<metadata id="original-cohort-evidence">Data cohort SHA256 07c77c1abcb91564c1bdb0948c7961c780b74fd5f00aef2695cc68ed21d90e70. 2026-11-01. Core Ultra 7 255H | Linux | ext4 | rustc 1.97.1. Median foreground milliseconds from seven runs; ranges are observed minima/maxima, not confidence intervals. Artifact-cold/page-warm; audit included. Warm is warm-session edit. Release uses canonical two-library clean restores; original flags retained. Concurrent paired differences are frust minus Cargo. Two concurrent separate targets, shared empty cache with intra-group peer reuse; paired differences are frust minus Cargo; not isolated cold builds.</metadata>
