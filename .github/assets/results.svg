<text x="40" y="268" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">Apple Silicon, warm cache. Solid blocks are the low end of the measured range, dim blocks run to the high end.</text>
<text x="40" y="292" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b949e">An uncached compile is no faster than cargo. Release binaries match cargo's in the same target dir.</text>
